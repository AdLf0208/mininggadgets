[mod]
id = "mininggadgets"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure gadget arithmetic (standalone crate lib, injected as
# `crate::game::mininggadgets`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mininggadgets"
source = "runtime.rs"

# Game-side glue: the held stack, its FE buffer, the break and the commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "mininggadgets_state"
source = "support.rs"

# Before content loads: register the `mininggadgets:*` component ids the
# gadget's upgrades, its chosen range and each upgrade card keep.
[[injection]]
id = "component-types"
hook = "component_types"
hook_version = 1
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "types" },
]

# The gadget declares an FE buffer (API 307): the engine keeps the charge in
# the stack's `minecraft:custom_data` as `horizon_energy`.
[[injection]]
id = "item-energy-buffer"
hook = "item_energy_buffer"
hook_version = 1
kind = "HEAD"
helper = "item_energy_buffer.rs"
bindings = [
  { name = "item", ty = "&str", value = "item" },
  { name = "buffer", ty = "&mut Option<horizon_client::game::ItemEnergyBuffer>", value = "buffer" },
]

# Right click on a block: the laser fires at the aimed face and claims the use.
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# Right click in the air: the laser ray-casts to its beam range and fires.
[[injection]]
id = "use-item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# The gadget's tooltip: its charge, its per-block price and its range.
[[injection]]
id = "gadget-tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(Text, u32)>", value = "lines" },
]

# `/mininggadgets info|energy|range|upgrade`: the harness controls the in-game
# check uses (there is no modification table or settings screen in slice 1).
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
